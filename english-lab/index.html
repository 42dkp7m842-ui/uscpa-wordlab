function csvRows(s){var out=[],row=[],v="",q=false;for(var i=0;i<s.length;i++){var c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===","&&!q){row.push(v);v=""}else if((c==="\n"||c==="\r")&&!q){if(c==="\r"&&s[i+1]==="\n")i++;row.push(v);if(row.some(Boolean))out.push(row);row=[];v=""}else v+=c}row.push(v);if(row.some(Boolean))out.push(row);var h=(out.shift()||[]).map(function(x){return x.trim().toLowerCase().replace(/^\uFEFF/,"")});return out.map(function(a){return Object.fromEntries(h.map(function(k,i){return [k,a[i]||""]}))})}

function clean(v){v=String(v||"").trim();if(!v||/《差別的表現》|死語|《古語》|《廃》/.test(v))return "";v=v.replace(/《[^》]*》/g,"").replace(/〈[^〉]*〉/g,"").split(" / ")[0].trim();return /[ぁ-んァ-ン一-龯]/.test(v)?v.slice(0,110):""}

function parseDic(t,dict,compound){t.split(/\r?\n/).forEach(function(line){var i=line.indexOf("\t");if(i<1)return;var ja=clean(line.slice(i+1));if(!ja)return;line.slice(0,i).split(",").forEach(function(w){w=w.trim().toLowerCase();if(valid(w)){if(!dict.has(w))dict.set(w,ja)}else if(/^[a-z]+(?: [a-z]+){1,4}$/.test(w)){if(!compound.has(w))compound.set(w,ja)}})})}

function choosePhrases(comps,rank){var out=makeSeed(starterP,"phrases"),seen=new Set(out.map(function(x){return x.term.toLowerCase()})),pos=new Map(rank.map(function(w,i){return [w,i]})),a=[];comps.forEach(function(ja,term){var words=term.split(" ");if(seen.has(term)||term.length>40||words.length>5)return;var val=words.reduce(function(s,w){return s+(pos.get(w)||30000)},0)/words.length,sc=(words.some(function(w){return bizSet.has(w)})?13000:0)+(bHint.test(ja)?5000:0)-val/4; a.push({term:term,ja:ja,score:sc})});a.sort(function(x,y){return y.score-x.score});a.forEach(function(x){if(out.length>=1000||seen.has(x.term))return;seen.add(x.term);out.push({id:"p-auto-"+out.length,term:x.term,ja:x.ja,stage:3,kind:"phrases",checked:false})});return out}
