/* AI import flow */
.ai-hero{background:linear-gradient(130deg,#edf2ff,#f9fcff 75%);border:1px solid #d5e2ff;padding:17px;border-radius:16px}
.ai-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}
.ai-step{background:white;border:1px solid #e0e8f6;border-radius:11px;padding:11px 9px;text-align:center;font-size:11px;color:#566b86;font-weight:650}

.ai-tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.ai-tools a{color:#3157df;text-decoration:none}
.ai-textarea{resize:vertical;min-height:130px;line-height:1.5}
.ai-preview-row{border:1px solid #e1e8f2;border-radius:13px;padding:13px;background:#fff;margin-top:10px}
.ai-row-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:9px}
.ai-row-head .ai-check{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;min-width:0}
.ai-check input{width:17px;height:17px;accent-color:#365bef}
.ai-row-fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ai-row-fields label{font-size:11px;font-weight:750;color:#62738b}
.ai-row-fields .field{padding:9px 10px;min-height:38px;font-size:13px;margin-top:3px}
.ai-row-note{margin-top:7px}
.ai-row-note .field{margin-top:4px}
.ai-summary{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:#64748b;margin:10px 0}
.ai-count{border-radius:8px;background:#eef3fb;padding:5px 9px;font-weight:700}
.ai-count.eligible{background:#dff6ec;color:#126b52}
.ai-count.dupe{background:#fff1e0;color:#945809}
.ai-preview-list{max-height:560px;overflow:auto;padding-right:3px}
.ai-import-actions{position:sticky;bottom:0;background:#fff;padding:12px 0 2px;display:flex;align-items:center;gap:10px;z-index:1}
.ai-import-actions .btn{flex:1}

function makeQueue(){let arr=db.words.slice();const prog=w=>db.progress[w.id];if(mode==='new')arr=arr.filter(w=>!prog(w));else if(mode==='due')arr=arr.filter(isDue);else if(mode==='weak')arr=arr.filter(w=>w.flagged||['again','hard'].includes(prog(w)?.last));else if(mode==='account')arr=arr.filter(w=>w.section==='勘定科目');else if(mode==='process')arr=arr.filter(w=>w.section==='会計処理');else if(mode==='basic')arr=arr.filter(w=>w.section==='基本用語');if(mode==='priority'){arr.sort((a,b)=>{const score=w=>(w.flagged?-35:0)+(status(w)==='missed'?-40:0)+(status(w)==='hard'?-25:0)+(isDue(w)?-15:0)+(!prog(w)?-10:0);return score(a)-score(b)})}return arr.map(w=>w.id)}

function libraryRows(){const key=norm(search);let list=db.words.filter(w=>{if(key && ![w.term,w.ja,w.note,w.category,w.example].some(x=>norm(x).includes(key)))return false;if(filter==='weak')return w.flagged||['again','hard'].includes(db.progress[w.id]?.last);if(filter==='new')return !db.progress[w.id];if(filter==='known')return db.progress[w.id]?.last==='good';if(filter==='basic')return w.section==='基本用語';if(filter==='account')return w.section==='勘定科目';if(filter==='process')return w.section==='会計処理';return true});let count=list.length;let view=list.slice(0,visibleLimit);const html=view.map(w=>{let p=db.progress[w.id];return `<details class="word-row"><summary><span><span class="word-en">${esc(w.term)}</span><span class="word-ja" style="display:block">${esc(w.ja)}</span></span><span class="wordrow-right"><span class="tag ${w.flagged?'weak':''}">${w.flagged?'★ 重点':esc(w.category)}</span><span style="color:#91a1b6;font-size:18px">⌄</span></span></summary><div class="detail"><div><b>意味・使い方：</b>${esc(w.note||'')}</div>${w.example?`<div class="ex">${esc(w.example)}<small>${esc(w.translation)}</small></div>`:''}<div style="color:#7d8aa0;font-size:12px;margin:9px 0">${esc(w.section)} ／ ${p?('最終判定：'+({again:'もう一度',hard:'あやふや',good:'覚えた'}[p.last])):'未学習'}</div><div class="btnrow"><button type="button" class="btn small secondary" data-star="${esc(w.id)}">${w.flagged?'★ 重点解除':'☆ 重点に追加'}</button><button type="button" class="btn small outline" data-edit="${esc(w.id)}">編集</button>${w.id.startsWith('custom-')?`<button type="button" class="btn small danger" data-delete="${esc(w.id)}">削除</button>`:''}</div></div></details>`}).join('');return `<div class="countline">${count}語が該当</div><div class="word-list">${html||'<div class="empty">条件に一致する単語がありません</div>'}</div>${visibleLimit<count?'<div style="margin-top:14px;text-align:center"><button type="button" class="btn secondary" id="more">さらに表示（残り'+(count-visibleLimit)+'語）</button></div>':''}`}

function aiNormalize(raw){

 if(input.length>1500000)throw Error('データが大きすぎます。写真を分割してください');
 const htmlEntities={amp:'&',quot:'"',apos:"'",lt:'<',gt:'>',nbsp:' '};
 const decodeEntities=s=>s.replace(/&(#x[0-9a-f]+|#[0-9]+|amp|quot|apos|lt|gt|nbsp);/gi,(m,k)=>{
  if(k[0]==='#'){const n=k[1]?.toLowerCase()==='x'?parseInt(k.slice(2),16):parseInt(k.slice(1),10);return Number.isInteger(n)&&n>=0&&n<=0x10ffff?String.fromCodePoint(n):m;}

// Delegation: study controls only alter the card, not browser location/hash or scroll.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;editingId=null;render(false);window.scrollTo(0,0);return}const modeBtn=e.target.closest('[data-mode]');if(modeBtn){mode=modeBtn.dataset.mode;restart();render();return}const dirBtn=e.target.closest('[data-direction]');if(dirBtn){direction=dirBtn.dataset.direction;render();return}if(e.target.closest('#flashcard')||e.target.closest('#reveal')){flip();return}const rating=e.target.closest('[data-grade]');if(rating){grade(rating.dataset.grade);return}if(e.target.closest('#skip')){next();return}if(e.target.closest('#prev')){session.index=Math.max(0,session.index-1);render();return}if(e.target.closest('#restart')||e.target.closest('#retry')){restart();render();return}if(e.target.closest('#toggle-star')){const w=currentWord();if(w){w.flagged=!w.flagged;save();render();toast(w.flagged?'重点単語に追加':'重点設定を解除')}return}const star=e.target.closest('[data-star]');if(star){const w=db.words.find(x=>x.id===star.dataset.star);if(w){w.flagged=!w.flagged;save();updateLibrary()}return}const edit=e.target.closest('[data-edit]');if(edit){editingId=edit.dataset.edit;tab='add';render(false);window.scrollTo(0,0);return}const del=e.target.closest('[data-delete]');if(del){const w=db.words.find(x=>x.id===del.dataset.delete);if(w?.id.startsWith('custom-')&&confirm('この単語を削除しますか？')){db.words=db.words.filter(x=>x.id!==w.id);delete db.progress[w.id];save();restart();updateLibrary()}return}if(e.target.closest('#more')){visibleLimit+=50;updateLibrary();return}if(e.target.closest('#cancel-edit')){editingId=null;render();return}if(e.target.closest('#ai-copy')){copyAI();return}if(e.target.closest('#ai-file-btn')){$('ai-file')?.click();return}if(e.target.closest('#ai-parse')){aiDraft=$('ai-paste').value;aiParse(aiDraft);return}if(e.target.closest('#ai-clear')){aiCandidates=[];aiDraft='';if($('ai-paste'))$('ai-paste').value='';if($('ai-feedback'))$('ai-feedback').innerHTML='';aiPreviewRefresh();return}if(e.target.closest('#ai-save')){aiSave();return}if(e.target.closest('#bulk-add')){bulkAdd();return}if(e.target.closest('#export')){exportData();return}if(e.target.closest('#importBtn')){$('importFile').click();return}if(e.target.closest('#resetProgress')){if(confirm('学習の判定と復習予定をすべて削除しますか？単語と重点設定は残ります。')){db.progress={};save();restart();render();toast('学習判定をリセットしました')}return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;visibleLimit=40;updateLibrary()}if(e.target.id==='ai-paste'){aiDraft=e.target.value}if(e.target.matches('[data-ai-index][data-ai-field]')&&e.target.dataset.aiField!=='selected'){const row=aiCandidates[Number(e.target.dataset.aiIndex)];if(row)row[e.target.dataset.aiField]=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;visibleLimit=40;updateLibrary()}if(e.target.id==='studyModeSelect'){mode=e.target.value;restart();render()}if(e.target.id==='directionSelect'){direction=e.target.value;render()}if(e.target.id==='importFile'&&e.target.files?.[0])importData(e.target.files[0]);if(e.target.id==='ai-file'&&e.target.files?.[0]){aiFile(e.target.files[0]);e.target.value=''}if(e.target.matches('[data-ai-index][data-ai-field]')){const row=aiCandidates[Number(e.target.dataset.aiIndex)];if(row){if(e.target.dataset.aiField==='selected')row.selected=e.target.checked;else{row[e.target.dataset.aiField]=e.target.value;const m=aiMeta();if(!m.status[Number(e.target.dataset.aiIndex)])row.selected=true}aiPreviewRefresh()}}});
document.addEventListener('submit',e=>{if(e.target.id==='wordform')wordSave(e)});
document.addEventListener('keydown',e=>{if(e.target.id==='flashcard'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip()}});
restart();render(false);
</script>
</body>
</html>
