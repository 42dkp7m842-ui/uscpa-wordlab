/* AI import flow */
.ai-hero{background:linear-gradient(130deg,#edf2ff,#f9fcff 75%);border:1px solid #d5e2ff;padding:17px;border-radius:16px}
.ai-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}
.ai-step{background:white;border:1px solid #e0e8f6;border-radius:11px;padding:11px 9px;text-align:center;font-size:11px;color:#566b86;font-weight:650}
.ai-step b{display:block;font-size:17px;color:#3157df;margin-bottom:4px}
.ai-tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.ai-tools a{color:#3157df;text-decoration:none}
.ai-textarea{resize:vertical;min-height:130px;line-height:1.5}
.ai-preview-row{border:1px solid #e1e8f2;border-radius:13px;padding:13px;background:#fff;margin-top:10px}
.ai-row-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:9px}
.ai-row-head .ai-check{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;min-width:0}
.ai-check input{width:17px;height:17px;accent-color:#365bef}
.ai-row-fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ai-row-fields label{font-size:11px;font-weight:750;color:#62738b}
.ai-row-fields .field{padding:9px 10px;min-height:38px;font-size:13px;margin-top:3px}
.ai-row-note{margin-top:7px}
.ai-row-note .field{margin-top:4px}
.ai-summary{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:#64748b;margin:10px 0}
.ai-count{border-radius:8px;background:#eef3fb;padding:5px 9px;font-weight:700}
.ai-count.eligible{background:#dff6ec;color:#126b52}
.ai-count.dupe{background:#fff1e0;color:#945809}
.ai-preview-list{max-height:560px;overflow:auto;padding-right:3px}
.ai-import-actions{position:sticky;bottom:0;background:#fff;padding:12px 0 2px;display:flex;align-items:center;gap:10px;z-index:1}
.ai-import-actions .btn{flex:1}
@media(max-width:460px){.ai-tools{grid-template-columns:1fr}.ai-steps{gap:5px}.ai-step{font-size:10px;padding:9px 4px}.ai-row-fields{grid-template-columns:1fr}}

/* Four-section USCPA interface */
.subjectbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.subject-pill{display:flex;flex-direction:column;gap:1px;align-items:flex-start;background:white;color:#4d617e;border:1px solid #dfe6f2;padding:10px 12px;border-radius:13px;min-width:0;text-align:left;transition:background .15s,border-color .15s}
.subject-pill b{font-size:17px;color:#293f5d;letter-spacing:.02em}
.subject-pill span{font-size:10px;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.subject-pill em{font-style:normal;font-size:12px;font-weight:750;color:#708199}
.subject-pill.active{background:#263f87;border-color:#263f87;box-shadow:0 4px 14px rgba(32,55,130,.17)}
.subject-pill.active b,.subject-pill.active span,.subject-pill.active em{color:#fff}
.subject-label{font-size:10px;color:#3154be;font-weight:850;background:#ecf0ff;border-radius:8px;padding:3px 6px}
.subject-checks{display:flex;gap:10px;flex-wrap:wrap;padding:9px 0}
.subject-checks label{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#3c5377;white-space:nowrap}
.subject-checks input{accent-color:#365bef;width:16px;height:16px}
.subject-progress-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.subject-progress{border:1px solid #e0e8f4;padding:13px;border-radius:12px;background:#fcfdff}
.subject-progress b{font-size:17px;color:#28488f}.subject-progress span{font-size:12px;margin-left:10px;font-weight:700}
.subject-progress small{font-size:11px;color:#7b889e}
.subject-progress .track{height:7px;border-radius:5px;background:#e8eef9;margin:9px 0 4px;overflow:hidden}
.subject-progress .fill{height:100%;background:#5679e9}
@media(max-width:690px){.subjectbar{gap:5px}.subject-pill{padding:9px 5px;align-items:center;text-align:center;border-radius:11px}.subject-pill b{font-size:14px}.subject-pill span{font-size:8px}.subject-pill em{font-size:10px}.subject-progress-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wordrow-right{gap:3px}}

function normalizeSubjects(raw,fallback='FAR'){
 const allowed=['FAR','REG','AUD','TCP'];
 const list=Array.isArray(raw)?raw:typeof raw==='string'?(raw.includes(',')?raw.split(','):[raw]):[];
 const valid=[...new Set(list.map(x=>String(x||'').trim().toUpperCase()).filter(x=>allowed.includes(x)))];
 return valid.length?valid:[fallback==='REG'||fallback==='AUD'||fallback==='TCP'?fallback:'FAR'];
}

function structuredCloneSafe(value){return JSON.parse(JSON.stringify(value))}
let hasStorage = true;
function load(){
 const fresh=initial();
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return fresh;
  const old=JSON.parse(raw);
  if(!Array.isArray(old.words)||!old.words.length)return fresh;
  const result=structuredCloneSafe(old.words);
  const key=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const seen=new Set(result.map(w=>key(w.term)));
  let added=0;
  for(const w of CORE_WORDS){
   const id=key(w.term);
   if(!seen.has(id)){result.push(structuredCloneSafe(w));seen.add(id);added++}
  }
  const merged={words:result,progress:old.progress||{}};
  if(added){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged))}catch(e){hasStorage=false}}
  return merged;
 }catch(e){hasStorage=false;return fresh}
}

function makeQueue(){
 let arr=visibleWords();const prog=w=>db.progress[w.id];
 if(mode==='new')arr=arr.filter(w=>!prog(w));

 else if(mode==='weak')arr=arr.filter(w=>w.flagged||['again','hard'].includes(prog(w)?.last));
 else if(mode==='account')arr=arr.filter(w=>w.section==='勘定科目');

function aiMeta(){

).join('')}</select></div><button class="btn primary full" type="submit">${editingId?'変更を保存':'単語を登録'}</button></form><div id="add-feedback"></div></section><section class="panel"><div class="title-row"><div><div class="eyebrow">BULK IMPORT</div><h2>複数語をまとめて追加</h2></div></div><p class="subtitle">1行につき「英単語 ↹ 日本語訳 ↹ 補足」の順にタブ区切り。登録科目は上のAI取込欄で選択した科目です。</p><div class="fieldgroup" style="margin-top:13px"><textarea class="field" id="bulk" rows="6" placeholder="accrued expense&#9;未払費用&#9;当期発生、次期支払い\nprepaid expense&#9;前払費用&#9;支払い済みの未経過分"></textarea></div><button type="button" class="btn secondary" id="bulk-add">まとめて登録</button><div id="bulk-feedback"></div></section>`}
function progressPage(){
 const all=['FAR','REG','AUD','TCP'];
 const r=summary();
 const subjectRows=all.map(k=>{
  const items=db.words.filter(w=>getSubjects(w).includes(k));
  const learned=items.filter(w=>db.progress[w.id]).length;
  const due=items.filter(isDue).length;
  return `<div class="subject-progress"><b>${k}</b><span>${items.length}語</span><div class="track"><div class="fill" style="width:${items.length?Math.round(100*learned/items.length):0}%"></div></div><small>${learned}学習済 / ${due}要復習</small></div>`
 }).join('');
 const groups=[...new Set(visibleWords().map(w=>w.section||'追加した単語'))].map(name=>[name,visibleWords().filter(w=>(w.section||'追加した単語')===name)]).filter(x=>x[1].length);
 return `${statHtml()}<section class="panel"><div class="eyebrow">FOUR SUBJECTS · PROGRESS</div><h2>科目別学習状況</h2><div class="subject-progress-grid">${subjectRows}</div><p class="subtitle" style="margin-top:13px">同じ用語が複数科目に関連する場合、科目別数にはそれぞれ計上します。全科目数はユニーク語数です。</p><div style="margin:18px 0"><div style="font-size:13px;display:flex;justify-content:space-between"><strong>${activeSubject==='ALL'?'全科目':activeSubject} の学習進捗</strong><span>${r.reviewed} / ${r.total}語</span></div><div class="meter" style="height:11px;margin-top:7px"><div style="width:${r.total?Math.round(100*r.reviewed/r.total):0}%"></div></div></div>${groups.map(([name,words])=>`<div class="barrow"><span>${esc(name)}</span><div class="track"><div class="fill" style="width:${Math.round(100*words.filter(w=>db.progress[w.id]).length/words.length)}%"></div></div><b>${words.filter(w=>db.progress[w.id]).length}/${words.length}</b></div>`).join('')}<div class="note-block" style="margin-top:15px">「覚えた」は初回3日後、「あやふや」は翌日、「もう一度」は10分後を目安に復習対象となります。</div></section><section class="panel"><div class="eyebrow">MY DATA</div><h2>データ保存と引き継ぎ</h2><p class="subtitle" style="margin:10px 0 15px">既存の単語と学習履歴を保持する保存形式です。Safariとホーム画面版は自動同期しません。端末変更時はバックアップを保存してください。</p><div class="btnrow"><button class="btn primary" type="button" id="export">↓ 全科目バックアップ保存</button><button class="btn secondary" type="button" id="importBtn">↑ バックアップを統合</button><input id="importFile" type="file" accept="application/json,.json" style="display:none"></div><div class="note-block" style="margin-top:16px"><strong>Safari ⇄ ホーム画面版でデータを移す</strong><p style="margin:8px 0">① 保存元で「全データをコピー」 → ② 保存先で貼り付け → ③ 「統合」。重複は増やさず科目タグも統合します。</p><button class="btn primary" type="button" id="sync-copy">① 全データをコピー</button><label class="field-label" for="sync-paste" style="margin-top:12px">② 他の画面からコピーしたデータ</label><textarea class="field ai-textarea" id="sync-paste" rows="3" placeholder="ここにバックアップのJSONを貼り付け"></textarea><div style="margin-top:10px"><button class="btn secondary" type="button" id="sync-merge">③ データを統合</button></div><p id="sync-feedback" role="status" style="font-size:12px;color:#526681;margin:9px 0"></p><small>復習履歴はGitHubに公開されません。手動移行です。</small></div>${!hasStorage?'<div class="alert error">端末内への保存が制限されています。必ずバックアップを使用してください。</div>':''}</section>`
}
function render(preserve=true){const y=window.scrollY;renderSubjectBar();renderNav();$('app').innerHTML=tab==='study'?study():tab==='library'?library():tab==='add'?addPage():progressPage();if(preserve)window.scrollTo(0,y)}
function toast(msg,err=false){let old=$('toast');if(old)old.remove();const e=document.createElement('div');e.id='toast';e.className='toast';e.textContent=msg;e.style.background=err?'#903441':'#203c5b';document.body.appendChild(e);if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2400)}
function flip(){let card=$('flashcard');if(!card)return;let on=card.classList.toggle('flipped');card.setAttribute('aria-pressed',String(on));$('pre-grade').classList.toggle('hide',on);$('grade').classList.toggle('hide',!on)}
function next(){session.index++;render()}
function grade(r){const w=currentWord();if(!w)return;const p=db.progress[w.id]||{reps:0,interval:0};let interval=0;if(r==='again'){p.reps=0;p.interval=0;p.due=Date.now()+10*60*1000}else if(r==='hard'){p.reps=Math.max(0,p.reps);p.interval=1;p.due=Date.now()+24*60*60*1000}else{p.reps=(p.reps||0)+1;interval=p.reps===1?3:p.reps===2?7:Math.round(Math.max(7,(p.interval||7)*2.2));p.interval=interval;p.due=Date.now()+interval*24*60*60*1000}p.last=r;p.updated=Date.now();db.progress[w.id]=p;save();session.done++;next()}
function updateLibrary(){const n=$('library-rows');if(n)n.innerHTML=libraryRows()}
function wordSave(e){
 e.preventDefault();
 const term=$('term').value.trim(),ja=$('ja').value.trim();
 const subjects=[...document.querySelectorAll('[name="manual-subject"]:checked')].map(x=>x.value);
 if(!term||!ja)return toast('英単語と日本語訳を入力してください',true);
 if(!subjects.length)return toast('関連科目を1つ以上選択してください',true);
 const dup=db.words.find(w=>norm(w.term)===norm(term)&&w.id!==editingId);
 if(dup)return toast('登録済みです。単語帳の「編集」から科目を追加できます',true);
 const data={term,ja,note:$('note').value.trim(),example:$('example').value.trim(),translation:$('translation').value.trim(),section:$('section').value.trim()||'追加した単語',category:'追加',subjects,flagged:false};
 if(editingId){const idx=db.words.findIndex(w=>w.id===editingId);if(idx>=0)db.words[idx]={...db.words[idx],...data,flagged:db.words[idx].flagged}}
 else db.words.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),...data});
 save();editingId=null;restart();render();toast('単語を保存しました');
}
function bulkAdd(){
 const lines=($('bulk').value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),subject=importSubject;
 let added=0,linked=0,skipped=0;
 for(const line of lines){
  const f=line.split('\t').map(x=>x.trim());
  if(f.length<2||!f[0]||!f[1]){skipped++;continue}
  const existing=db.words.find(w=>norm(w.term)===norm(f[0]));
  if(existing){const subs=getSubjects(existing);if(!subs.includes(subject)){existing.subjects=[...subs,subject];linked++}else skipped++;continue}
  db.words.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),term:f[0],ja:f[1],note:f[2]||'',example:'',translation:'',section:'追加した単語',category:'追加',subjects:[subject],flagged:false});added++;
 }
 save();$('bulk').value='';restart();
 $('bulk-feedback').innerHTML=`<div class="alert">${subject} に新規 ${added}語、科目追加 ${linked}件。重複など ${skipped}件。</div>`;
}
function mergeWordlabBackup(current,incoming){
 if(!incoming||incoming.app!=='uscpa-wordlab'||!Array.isArray(incoming.words)||!incoming.words.length||!incoming.progress||typeof incoming.progress!=='object'||Array.isArray(incoming.progress))throw Error('Word Labのバックアップ形式ではありません。');
 if(incoming.words.length>10000)throw Error('単語数が多すぎます');
 const next=JSON.parse(JSON.stringify(current));
 const canon=s=>String(s||'').trim().toLocaleLowerCase('en-US').replace(/\s+/g,' ');
 const byTerm=new Map(next.words.map(w=>[canon(w.term),w]));
 const ids=new Set(next.words.map(w=>w.id));
 let added=0,dupes=0,updated=0,flagged=0,subjectChanges=0;
 incoming.words.forEach((w,i)=>{
  if(!w||typeof w.term!=='string'||!w.term.trim()||typeof w.ja!=='string'||!w.ja.trim())throw Error('英単語か日本語訳が欠けています。取込を中止しました。');
  const k=canon(w.term),previous=byTerm.get(k);let targetId;
  if(previous){
   dupes++;targetId=previous.id;
   if(w.flagged&&!previous.flagged){previous.flagged=true;flagged++}
   const oldSubjects=getSubjects(previous),newSubjects=[...new Set([...oldSubjects,...getSubjects(w)])];
   if(newSubjects.length>oldSubjects.length){previous.subjects=newSubjects;subjectChanges++}
  }else{
   let id=typeof w.id==='string'&&w.id&&!ids.has(w.id)?w.id:'custom-sync-'+Date.now()+'-'+i;
   while(ids.has(id))id+='x';
   const fresh={id,term:w.term.trim(),ja:w.ja.trim(),note:String(w.note||''),example:String(w.example||''),translation:String(w.translation||''),section:String(w.section||'追加した単語'),category:String(w.category||'追加'),flagged:!!w.flagged,subjects:getSubjects(w)};
   next.words.push(fresh);byTerm.set(k,fresh);ids.add(id);targetId=id;added++;
  }
  const from=incoming.progress[w.id];
  if(from&&typeof from==='object'&&!Array.isArray(from)){
   const existing=next.progress[targetId];
   if(!existing||Number(from.updated||0)>Number(existing.updated||0)){next.progress[targetId]=JSON.parse(JSON.stringify(from));updated++}
  }
 });
 return {data:next,added,dupes,updated,flagged,subjectChanges};
}
function syncBackupText(){return JSON.stringify({app:'uscpa-wordlab',version:1,exportedAt:new Date().toISOString(),words:db.words,progress:db.progress})}
async function syncCopy(){
 const payload=syncBackupText();
 try{
  await navigator.clipboard.writeText(payload);
  const box=$('sync-feedback');if(box)box.textContent=db.words.length+'語のデータをコピーしました。もう一方の画面の「進捗・保存」へ貼り付けてください。';
  toast('学習データをコピーしました');
 }catch(e){
  const box=$('sync-paste');
  if(box){box.value=payload;box.focus();box.select()}
  const msg=$('sync-feedback');if(msg)msg.textContent='自動コピーが許可されませんでした。表示された文字列を「すべて選択 → コピー」してください。';
 }
}
function syncMerge(){
 const field=$('sync-paste');
 if(!field||!field.value.trim())return toast('②の欄にコピーした学習データを貼り付けてください',true);
 try{
  const raw=field.value.trim();
  if(raw.length>3000000)throw Error('データが大きすぎます');
  const incoming=JSON.parse(raw);
  const merged=mergeWordlabBackup(db,incoming);
  if(!merged.added&&!merged.updated&&!merged.flagged&&!merged.subjectChanges){const msg=$('sync-feedback');if(msg)msg.textContent='引き継ぐ新しい単語・科目・復習記録はありませんでした。';return}
  if(!confirm('新規 '+merged.added+'語、科目更新 '+merged.subjectChanges+'件、復習記録 '+merged.updated+'件を統合しますか？'))return;
  db=merged.data;save();restart();render(false);toast('引き継ぎ完了／合計'+db.words.length+'語');
 }catch(e){const box=$('sync-feedback');if(box)box.textContent='取込できません：'+e.message;toast('取込に失敗しました',true)}
}
function exportData(){let data={app:'uscpa-wordlab',version:1,exportedAt:new Date().toISOString(),words:db.words,progress:db.progress};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='USCPA_WordLab_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('バックアップを保存しました')}
function importData(file){
 return file.text().then(content=>{
  const incoming=JSON.parse(content);const merged=mergeWordlabBackup(db,incoming);
  if(!merged.added&&!merged.updated&&!merged.flagged&&!merged.subjectChanges)return toast('追加・更新する単語や復習履歴はありませんでした');
  if(!confirm('新規 '+merged.added+'語、科目更新 '+merged.subjectChanges+'件、復習記録 '+merged.updated+'件を統合しますか？ 現在のデータは削除しません。'))return;
  db=merged.data;save();restart();render();toast('データを統合しました。合計'+db.words.length+'語');
 }).catch(e=>toast('読込失敗：'+e.message,true));
}
// Delegation: study controls only alter the card, not browser location/hash or scroll.
document.addEventListener('click',e=>{const subjectButton=e.target.closest('[data-subject]');if(subjectButton){activeSubject=subjectButton.dataset.subject;importSubject=activeSubject==='ALL'?'FAR':activeSubject;restart();render(false);return}const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;editingId=null;render(false);window.scrollTo(0,0);return}const modeBtn=e.target.closest('[data-mode]');if(modeBtn){mode=modeBtn.dataset.mode;restart();render();return}const dirBtn=e.target.closest('[data-direction]');if(dirBtn){direction=dirBtn.dataset.direction;render();return}if(e.target.closest('#flashcard')||e.target.closest('#reveal')){flip();return}const rating=e.target.closest('[data-grade]');if(rating){grade(rating.dataset.grade);return}if(e.target.closest('#skip')){next();return}if(e.target.closest('#prev')){session.index=Math.max(0,session.index-1);render();return}if(e.target.closest('#restart')||e.target.closest('#retry')){restart();render();return}if(e.target.closest('#toggle-star')){const w=currentWord();if(w){w.flagged=!w.flagged;save();render();toast(w.flagged?'重点単語に追加':'重点設定を解除')}return}const star=e.target.closest('[data-star]');if(star){const w=db.words.find(x=>x.id===star.dataset.star);if(w){w.flagged=!w.flagged;save();updateLibrary()}return}const edit=e.target.closest('[data-edit]');if(edit){editingId=edit.dataset.edit;tab='add';render(false);window.scrollTo(0,0);return}const del=e.target.closest('[data-delete]');if(del){const w=db.words.find(x=>x.id===del.dataset.delete);if(w?.id.startsWith('custom-')&&confirm('この単語を削除しますか？')){db.words=db.words.filter(x=>x.id!==w.id);delete db.progress[w.id];save();restart();updateLibrary()}return}if(e.target.closest('#more')){visibleLimit+=50;updateLibrary();return}if(e.target.closest('#cancel-edit')){editingId=null;render();return}if(e.target.closest('#ai-copy')){copyAI();return}if(e.target.closest('#ai-file-btn')){$('ai-file')?.click();return}if(e.target.closest('#ai-parse')){aiDraft=$('ai-paste').value;aiParse(aiDraft);return}if(e.target.closest('#ai-clear')){aiCandidates=[];aiDraft='';if($('ai-paste'))$('ai-paste').value='';if($('ai-feedback'))$('ai-feedback').innerHTML='';aiPreviewRefresh();return}if(e.target.closest('#ai-save')){aiSave();return}if(e.target.closest('#bulk-add')){bulkAdd();return}if(e.target.closest('#sync-copy')){syncCopy();return}if(e.target.closest('#sync-merge')){syncMerge();return}if(e.target.closest('#export')){exportData();return}if(e.target.closest('#importBtn')){$('importFile').click();return}if(e.target.closest('#resetProgress')){if(confirm('学習の判定と復習予定をすべて削除しますか？単語と重点設定は残ります。')){db.progress={};save();restart();render();toast('学習判定をリセットしました')}return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;visibleLimit=40;updateLibrary()}if(e.target.id==='ai-paste'){aiDraft=e.target.value}if(e.target.matches('[data-ai-index][data-ai-field]')&&e.target.dataset.aiField!=='selected'){const row=aiCandidates[Number(e.target.dataset.aiIndex)];if(row)row[e.target.dataset.aiField]=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;visibleLimit=40;updateLibrary()}if(e.target.id==='ai-default-subject'){importSubject=e.target.value;if(aiCandidates.length){aiCandidates.forEach(w=>{if(!w.explicitSubject)w.subjects=[importSubject]});aiPreviewRefresh()}}if(e.target.matches('[data-ai-index][data-ai-subject]')){const w=aiCandidates[Number(e.target.dataset.aiIndex)];if(w){const selected=new Set(getSubjects(w));if(e.target.checked)selected.add(e.target.dataset.aiSubject);else selected.delete(e.target.dataset.aiSubject);if(!selected.size){e.target.checked=true;return}w.subjects=[...selected];w.selected=true;w.explicitSubject=true;aiPreviewRefresh()}}if(e.target.id==='studyModeSelect'){mode=e.target.value;restart();render()}if(e.target.id==='directionSelect'){direction=e.target.value;render()}if(e.target.id==='importFile'&&e.target.files?.[0])importData(e.target.files[0]);if(e.target.id==='ai-file'&&e.target.files?.[0]){aiFile(e.target.files[0]);e.target.value=''}if(e.target.matches('[data-ai-index][data-ai-field]')){const row=aiCandidates[Number(e.target.dataset.aiIndex)];if(row){if(e.target.dataset.aiField==='selected')row.selected=e.target.checked;else{row[e.target.dataset.aiField]=e.target.value;const m=aiMeta();if(['new','linked'].includes(m.status[Number(e.target.dataset.aiIndex)]))row.selected=true}aiPreviewRefresh()}}});
document.addEventListener('submit',e=>{if(e.target.id==='wordform')wordSave(e)});
document.addEventListener('keydown',e=>{if(e.target.id==='flashcard'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();flip()}});
restart();render(false);
